on:
  push:
    branches:
      - main
      - master
      - dev
  schedule:
    # Daily at 07:00 UTC, two hours after pkgdown publishes the
    # surface-water / groundwater ZIPs to the gh-pages branch.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      station_ids:
        description: 'Comma-separated Messstellennummer values to push (empty = auto)'
        required: false
        default: ''
      history_days:
        description: 'Push only the most recent N days per station (0 = all)'
        required: false
        default: '0'

name: thingsboard-push

jobs:
  push:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      TB_HOST: ${{ secrets.TB_HOST }}
      TB_API_KEY: ${{ secrets.TB_API_KEY }}
      TB_STATION_IDS: ${{ github.event.inputs.station_ids }}
      TB_HISTORY_DAYS: ${{ github.event.inputs.history_days || '0' }}
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::httr2
            any::jsonlite
            any::sf
          needs: check

      - name: Install package
        run: R CMD INSTALL .

      - name: Push to ThingsBoard
        run: Rscript inst/scripts/push_to_thingsboard.R
